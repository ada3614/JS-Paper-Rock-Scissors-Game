<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik+Spray+Paint&display=swap");
    </style>
    <title>Rock Paper Scissors Game</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1 class="rubik">Rock / Paper / Scissors</h1>
      </header>
      <section class="hands">
        <h2 class="montserrat">Choose hand:</h2>
        <div class="hands-wrapper wrapper">
          <div class="hand-item" data-handtype="rock">
            <div class="circle"></div>
            <img src="./img/rock.png" alt="rock" />
            <h3 class="rubik">Rock</h3>
          </div>
          <div class="hand-item" data-handtype="paper">
            <div class="circle"></div>
            <img src="./img/paper.png" alt="paper" />
            <h3 class="rubik">Paper</h3>
          </div>
          <div class="hand-item" data-handtype="scissors">
            <div class="circle"></div>
            <img src="./img/scissors.png" alt="scissors" />
            <h3 class="rubik">Scissors</h3>
          </div>
        </div>
      </section>
      <section class="buttons">
        <div class="buttons-wrapper wrapper">
          <button class="main">Let's play!</button>
          <button class="reset">Reset</button>
        </div>
      </section>
      <div class="result-popup" hidden>
        <div class="popup-content">
          <h2 class="result-title" id="result-title">YOU WIN!</h2>
          <button class="next-game">Next game</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
