<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik+Spray+Paint&display=swap");
    </style>
    <title>Rock Paper Scissors Game</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1 class="rubik">Rock / Paper / Scissors</h1>
      </header>
      <section class="hands">
        <h2 class="montserrat">Choose hand:</h2>
        <div class="hands-wrapper">
          <div class="hand-item">
            <div class="circle"></div>
            <img src="./img/rock.png" alt="rock" />
            <h3 class="rubik">Rock</h3>
          </div>
          <div class="hand-item">
            <div class="circle"></div>
            <img src="./img/paper.png" alt="paper" />
            <h3 class="rubik">Paper</h3>
          </div>
          <div class="hand-item">
            <div class="circle"></div>
            <img src="./img/scissors.png" alt="scissors" />
            <h3 class="rubik">Scissors</h3>
          </div>
        </div>
      </section>
    </div>
    <script src="script.js"></script>
  </body>
</html>
